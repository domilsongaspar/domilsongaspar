<defs>

  <filter
    id="shadow"
    x="-20%"
    y="-20%"
    width="140%"
    height="140%"
  >
    <feDropShadow
      dx="0"
      dy="3"
      stdDeviation="4"
      flood-opacity="0.25"
    />
  </filter>

  <style>

    .title {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      font-size: 22px;
      font-weight: 700;
      fill: #f0f6fc;
    }

    .language {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      font-size: 14px;
      font-weight: 600;
      fill: #c9d1d9;
    }

    .percentage {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      font-size: 13px;
      fill: #8b949e;
    }

    .bar {
      transform-origin: left;
      animation: grow 1.2s ease-out forwards;
    }

    @keyframes grow {
      from {
        transform: scaleX(0);
      }

      to {
        transform: scaleX(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bar {
        animation: none;
      }
    }

  </style>

</defs>

