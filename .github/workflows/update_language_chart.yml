name: Update Language Chart

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 0 * * 0"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-language-chart:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate language chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python .github/scripts/update-language-chart.py

      - name: Commit generated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md assets/languages.svg

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: update language chart"
            git push
          fi
